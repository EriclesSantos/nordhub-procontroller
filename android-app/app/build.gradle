plugins { id 'com.android.application' }
android {
    namespace 'com.switchphone'
    compileSdk 35
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.switchphone.controller'
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName '0.3.1-experimental'
        manifestPlaceholders = [appLabel: 'Nördhub ProController']
    }
    buildTypes {
        release { debuggable false; minifyEnabled false }
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [appLabel: 'Nördhub ProController Preview']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation files('libs/zxing-core-3.5.4.jar') }
